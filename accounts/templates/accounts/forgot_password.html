<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <title>Forgot Password | SMS</title>
</head>

<body class="bg-slate-50">

  <div class="flex min-h-screen items-center justify-center px-4">

    <div
      class="w-full max-w-md rounded-[2rem] border border-slate-200 bg-white/95 p-8 shadow-[0_30px_60px_-35px_rgba(15,23,42,0.4)]"
    >

      <!-- Heading -->
      <div class="relative mb-8">

        <!-- Back Button -->
        <a
          href="{% url 'login' %}"
          class="absolute -top-7 left-1/2 -translate-x-1/2 inline-flex items-center gap-1.5 rounded-xl bg-blue-600 px-3 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700"
        >
          <i class="fa-solid fa-arrow-left"></i>
          <p>Back</p>
        </a>

        <div class="pt-1 text-center">

          <h1 class="text-3xl font-semibold text-slate-900">
            Forgot Password
          </h1>

          <p class="mt-2 text-sm text-slate-500">
            Create a new password for your teacher account.
          </p>

        </div>

      </div>


      <!-- Form -->
      <form method="POST" class="space-y-5">

        {% csrf_token %}

        <!-- Username -->
        <label class="block">

          <span class="mb-2 block text-sm font-medium text-slate-700">
            Username
          </span>

          <input
            type="text"
            name="username"
            placeholder="Enter your username"
            class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
            required
          />

        </label>


        <!-- New Password -->
        <label class="block">

          <span class="mb-2 block text-sm font-medium text-slate-700">
            New Password
          </span>

          <div class="relative">

            <input
              type="password"
              name="new_password"
              id="new_password"
              placeholder="Enter new password"
              class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 pr-12 text-slate-900 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
              required
            />

            <!-- Show / Hide -->
            <button
              type="button"
              onclick="togglePassword('new_password', this)"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 transition hover:text-sky-600"
              aria-label="Show password"
            >
              <i class="fa-solid fa-eye"></i>
            </button>

          </div>

        </label>


        <!-- Confirm Password -->
        <label class="block">

          <span class="mb-2 block text-sm font-medium text-slate-700">
            Confirm Password
          </span>

          <div class="relative">

            <input
              type="password"
              name="confirm_password"
              id="confirm_password"
              placeholder="Confirm new password"
              class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 pr-12 text-slate-900 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
              required
            />

            <!-- Show / Hide -->
            <button
              type="button"
              onclick="togglePassword('confirm_password', this)"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 transition hover:text-sky-600"
              aria-label="Show password"
            >
              <i class="fa-solid fa-eye"></i>
            </button>

          </div>

        </label>


        <!-- Change Password Button -->
        <button
          type="submit"
          class="w-full rounded-2xl bg-sky-600 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-sky-500/20 transition hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2 focus:ring-offset-white"
        >
          <i class="fa-solid fa-key mr-2"></i>
          Change Password
        </button>

      </form>

    </div>

  </div>


  <!-- SweetAlert Django Messages -->
  {% if messages %}
    {% for message in messages %}

      <script>
        Swal.fire({
          toast: true,
          position: "top-end",
          title: "{{ message.tags|title }}",
          text: "{{ message }}",
          icon: "{{ message.tags }}",
          timer: 2500,
          timerProgressBar: true,
          showConfirmButton: false
        });
      </script>

    {% endfor %}
  {% endif %}


  <!-- Show / Hide Password -->
  <script>

    function togglePassword(inputId, button) {

      const input = document.getElementById(inputId);

      const isPassword = input.type === "password";

      input.type = isPassword ? "text" : "password";

      button.innerHTML = isPassword
        ? '<i class="fa-solid fa-eye-slash"></i>'
        : '<i class="fa-solid fa-eye"></i>';

      button.setAttribute(
        "aria-label",
        isPassword ? "Hide password" : "Show password"
      );

    }

  </script>

</body>

</html>
