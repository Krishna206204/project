{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SMS | Login</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body class="min-h-screen bg-slate-100">
    <div class="flex min-h-screen items-center justify-center px-4 py-10">
      <!-- Main Card -->
      <div
        class="relative w-full max-w-md rounded-[2rem] border border-slate-200 bg-white p-8 shadow-[0_30px_60px_-35px_rgba(15,23,42,0.4)]"
      >
        <!-- Back Button -->
        <div class="relative">
          <a
            href="{% url 'home' %}"
            class="absolute left-1/2 -top-5 -translate-x-1/2 inline-flex items-center gap-1 rounded-xl bg-blue-500 px-2 py-2 text-sm font-semibold text-white shadow transition hover:bg-blue-600"
          >
          Home
          <i class="fa-solid fa-house"></i>
          </a>
        </div>

        <!-- Header -->
        <div class="mb-8 pt-8 text-center">
          <!-- Icon -->
          <div
            class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-100 text-blue-600"
          >
            <i class="fa-solid fa-graduation-cap text-3xl"></i>
          </div>

          <h1 class="text-3xl font-semibold text-slate-900">Welcome Back</h1>

          <p class="mt-2 text-sm text-slate-500">
            Select your login role to continue.
          </p>
        </div>

        <!-- Role Buttons -->
        <div class="space-y-4">
          <!-- Student -->
          <a
            href="{% url 'student-lookup' %}"
            class="group flex w-full items-center justify-between rounded-2xl border border-slate-200 bg-slate-50 px-5 py-4 transition hover:border-blue-500 hover:bg-blue-50"
          >
            <div class="flex items-center gap-4">
              <div
                class="flex h-12 w-12 items-center justify-center rounded-xl bg-blue-100 text-blue-600"
              >
                <i class="fa-solid fa-user-graduate text-xl"></i>
              </div>

              <div class="text-left">
                <h2 class="font-semibold text-slate-900">Student</h2>

                <p class="text-sm text-slate-800">Student Login</p>
              </div>
            </div>

            <i
              class="fa-solid fa-chevron-right text-slate-400 transition group-hover:translate-x-1 group-hover:text-blue-600"
            ></i>
          </a>

          <!-- Teacher -->
          <a
            href="{% url 'login' %}"
            class="group flex w-full items-center justify-between rounded-2xl border border-slate-200 bg-slate-50 px-5 py-4 transition hover:border-emerald-500 hover:bg-emerald-50"
          >
            <div class="flex items-center gap-4">
              <div
                class="flex h-12 w-12 items-center justify-center rounded-xl bg-emerald-100 text-emerald-600"
              >
                <i class="fa-solid fa-chalkboard-user text-xl"></i>
              </div>

              <div class="text-left">
                <h2 class="font-semibold text-slate-900">Teacher</h2>

                <p class="text-sm text-slate-800">Teacher Login</p>
              </div>
            </div>

            <i
              class="fa-solid fa-chevron-right text-slate-400 transition group-hover:translate-x-1 group-hover:text-emerald-600"
            ></i>
          </a>

          <!-- Admin -->
          <a
            href="{% url 'admin-login' %}"
            class="group flex w-full items-center justify-between rounded-2xl border border-slate-200 bg-slate-50 px-5 py-4 transition hover:border-purple-500 hover:bg-purple-50"
          >
            <div class="flex items-center gap-4">
              <div
                class="flex h-12 w-12 items-center justify-center rounded-xl bg-purple-100 text-purple-600"
              >
                <i class="fa-solid fa-user-shield text-xl"></i>
              </div>

              <div class="text-left">
                <h2 class="font-semibold text-slate-900">Admin</h2>

                <p class="text-sm text-slate-800">Admin Login</p>
              </div>
            </div>

            <i
              class="fa-solid fa-chevron-right text-slate-400 transition group-hover:translate-x-1 group-hover:text-purple-600"
            ></i>
          </a>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-center">
          <h3 class="text-md text-slate-800">Student Management System </h3>
          <h4 class="text-sm text-slate-700">Jhime Malika Secondary School</h4>
        </div>
      </div>
    </div>
  </body>
</html>
