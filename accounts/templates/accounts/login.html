<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <title>SMS</title>
</head>

<body>
  <div class="flex min-h-screen items-center justify-center">
    <div
      class="w-full max-w-md rounded-[2rem] border border-slate-200 bg-white/95 p-8 shadow-[0_30px_60px_-35px_rgba(15,23,42,0.4)]">
      <div class="relative mb-8">

    <!-- Home button -->
    <a href="{% url 'login-selection' %}" 
      class="absolute -top-7 left-1/2 -translate-x-1/2 inline-flex items-center gap-1.5 rounded-xl bg-blue-600 px-3 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700"> 
      <i class="fa-solid fa-arrow-left"></i>
      <p>Back</p> 
  </a>

  
    <div class="text-center pt-1">
        <h1 class="text-3xl font-semibold text-slate-900">
            Welcome Back
        </h1>
        <h1 class="text-2xl font-semibold text-slate-800">
          Teacher Portal
        </h1>

        <p class="mt-2 text-sm text-slate-500">
            Sign in to your account to continue.
        </p>
    </div>

</div>
      
      <form action="" method="POST" class="space-y-5">
        {% csrf_token %}
        <label class="block">
          <span class="mb-2 block text-sm font-medium text-slate-700">Username</span>
          <input type="text" name="username" placeholder="Enter your username"
            class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"  required/>
        </label>

        <label class="block">
          <span class="mb-2 block text-sm font-medium text-slate-700">Password</span>
          <input type="password" name="password" placeholder="Enter your password"
            class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"  required/ >
        </label>

        <button type="submit"
          class="w-full rounded-2xl bg-sky-600 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-sky-500/20 transition hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2 focus:ring-offset-white">
          <i class="fa-solid fa-right-to-bracket mr-2"></i>
          Login</button>
      </form>


        {% comment %} <div class="mt-6 flex items-center justify-center gap-6">
          <div class="mt-6 text-center">
          <p class="text-slate-600">
            Are you a Student
          </p>

          <a href="{% url 'student-lookup' %}"
            class="mt-3 inline-flex items-center rounded-2xl bg-blue-600 px-6 py-3 text-base font-semibold text-white shadow-sm transition hover:bg-blue-700">
          <i class="fa-solid fa-user-tie mr-2"></i>
            Student Login
          </a>
          </div> 
          
        </div>
         {% endcomment %}
      </div>
    </div>
    
    {% if messages %} {% for message in messages %}
    <script>
      Swal.fire(
        {
          toast:true,
          position:"top-end",
          title:"{{ message.tag | title}}",
          text:"{{ message }}",
          icon:"{{ message.tag }}",
          timer:2500,
          timerProgressBar:true
        }
      );
    </script>
    {% endfor %} {% endif %}

</body>
</html>
