
<div class="flex items-center justify-between px-4 py-3 lg:hidden">

    <!-- School Name -->
    <a href="{% url 'home' %}"
       class="text-lg font-semibold text-slate-900">
        Jhime Malika Secondary School
    </a>


    <!-- Mobile Menu Button -->
    <button
        id="menu-btn"
        type="button"
        class="rounded-lg bg-[#0e1a3a] px-4 py-3 text-white">

        <i class="fa-solid fa-bars text-xl"></i>

    </button>

</div>



<div
    id="menu-overlay"
    class="fixed inset-0 z-40 hidden bg-black/40 lg:hidden">
</div>



<aside
    id="sidebar"
    class="fixed inset-y-0 left-0 z-50 hidden h-screen w-72 bg-[#0e1a3a] text-slate-100 shadow-2xl lg:flex lg:w-72 lg:flex-col">


   
    <div class="shrink-0 border-b border-white/10 px-6 py-6">

        <p
            class="text-xs font-semibold uppercase tracking-[0.35em] text-slate-400">
            School Portal
        </p>


        <div class="mt-4 flex items-center gap-3">

            <!-- Admin Icon -->
            <div
                class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-white/10 text-lg font-semibold">

                A

            </div>


            <!-- Admin Information -->
            <div>

                <p class="font-semibold">
                    Admin Panel
                </p>

                <p class="text-sm text-slate-400">
                    Academic Management
                </p>

            </div>

        </div>

    </div>



    
    <div class="min-h-0 flex-1 overflow-y-auto">

        <nav class="mt-6 space-y-2 px-3 pb-6">


            <!-- Dashboard -->
            <a
                href="{% url 'admin-dashboard' %}"
                class="flex items-center gap-3 rounded-sm px-4 py-3 text-slate-300 transition hover:bg-blue-500 hover:text-white">

                <span class="text-base">
                    <i class="fa-solid fa-gauge-high"></i>
                </span>

                <span>
                    Dashboard
                </span>

            </a>



            <!-- Students -->
            <a
                href="{% url 'admin-students' %}"
                class="flex items-center gap-3 rounded-sm px-4 py-3 text-slate-300 transition hover:bg-blue-500 hover:text-white">

                <span class="text-base">
                    <i class="fa-solid fa-user-graduate"></i>
                </span>

                <span>
                    Students
                </span>

            </a>



            <!-- Attendance -->
            <a
                href="{% url 'admin-today-attendance' %}"
                class="flex items-center gap-3 rounded-sm px-4 py-3 text-slate-300 transition hover:bg-blue-500 hover:text-white">

                <span class="text-base">
                    <i class="fa-solid fa-calendar-check"></i>
                </span>

                <span>
                    Attendance
                </span>

            </a>



            <!-- Student Marks -->
            <a
                href="{% url 'admin-view-marks' %}"
                class="flex items-center gap-3 rounded-sm px-4 py-3 text-slate-300 transition hover:bg-blue-500 hover:text-white">

                <span class="text-base">
                    <i class="fa-solid fa-clipboard-list"></i>
                </span>

                <span>
                    Student Marks
                </span>

            </a>



            <!-- Student Results -->
            <a
                href="{% url 'admin-report-cards' %}"
                class="flex items-center gap-3 rounded-sm px-4 py-3 text-slate-300 transition hover:bg-blue-500 hover:text-white">

                <span class="text-base">
                    <i class="fa-solid fa-file-pdf"></i>
                </span>

                <span>
                    Student Results
                </span>

            </a>
            



            <!-- Notice -->
            <a
                href="{% url 'admin-notice-list' %}"
                class="flex items-center gap-3 rounded-sm px-4 py-3 text-slate-300 transition hover:bg-blue-500 hover:text-white">

                <span class="text-base">
                    <i class="fa-solid fa-bullhorn"></i>
                </span>

                <span>
                    Notice
                </span>

            </a>
            <a
                href="{% url 'create-classroom' %}"
                class="flex items-center gap-3 rounded-sm px-4 py-3 text-slate-300 transition hover:bg-blue-500 hover:text-white">

                <span class="text-base">
                    <i class="fa-solid fa-school"></i>
                </span>

                <span>
                    Add Class
                </span>

            </a>
            <a
                href="{% url 'add-student' %}"
                class="flex items-center gap-3 rounded-sm px-4 py-3 text-slate-300 transition hover:bg-blue-500 hover:text-white">

                <span class="text-base">
                    <i class="fa-solid fa-user-plus"></i>
                </span>

                <span>
                    Add Student
                </span>

            </a>
            <a
                href="{% url 'student-upgrade' %}"
                class="flex items-center gap-3 rounded-sm px-4 py-3 text-slate-300 transition hover:bg-blue-500 hover:text-white">

                <span class="text-base">
                    <i class="fa-solid fa-arrow-up-right-dots"></i>
                </span>

                <span>
                    Upgrade Student
                </span>

            </a>
            <a
                href="{% url 'admin-contact-messages' %}"
                class="flex items-center gap-3 rounded-sm px-4 py-3 text-slate-300 transition hover:bg-blue-500 hover:text-white">

                <span class="text-base">
                   <i class="fa-solid fa-envelope"></i>
                </span>

                <span>
                    Messages
                </span>

            </a>

        </nav>

    </div>

    <div
        class="shrink-0 border-t border-white/10 bg-[#0e1a3a] p-2">


        <a
            href="{% url 'admin-logout' %}"
            id="logout-btn"
            class="flex items-center gap-2 rounded-lg px-3 py-2 text-md text-slate-300 transition hover:bg-red-400 hover:text-red-500">


            <!-- Logout Icon -->
            <span class="text-sm">

                <i class="fa-solid fa-right-from-bracket"></i>

            </span>


            <!-- Logout Text -->
            <span>
                Logout
            </span>


        </a>

    </div>

</aside>



<script>

    const menuBtn = document.getElementById("menu-btn");
    const sidebar = document.getElementById("sidebar");
    const menuOverlay = document.getElementById("menu-overlay");
    const logoutBtn = document.getElementById("logout-btn");



    menuBtn.addEventListener("click", function () {

        sidebar.classList.remove("hidden");

        menuOverlay.classList.remove("hidden");

    });



    menuOverlay.addEventListener("click", function () {

        sidebar.classList.add("hidden");

        menuOverlay.classList.add("hidden");

    });



    logoutBtn.addEventListener("click", function (event) {

        const confirmLogout = confirm(
            "Are you sure you want to logout?"
        );


        /*
         * If user clicks Cancel,
         * prevent Django logout URL from opening.
         */

        if (!confirmLogout) {

            event.preventDefault();

        }

    });

</script>
