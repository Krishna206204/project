{% extends "adminbase.html" %}

{% block title %}
    Edit Notice
{% endblock %}

{% block page_label %}
    Administration
{% endblock %}

{% block page_title %}
    Edit Notice
{% endblock %}

{% block content %}

<div class="mx-auto max-w-3xl">

    <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">

        <!-- Header -->
        <div class="border-b border-slate-200 bg-slate-50 px-6 py-5">

            <h2 class="text-xl font-semibold text-slate-900">
                Edit Notice
            </h2>

            <p class="mt-1 text-sm text-slate-500">
                Update the notice information below.
            </p>

        </div>


        <!-- Form -->
        <form method="POST" class="space-y-6 p-6">

            {% csrf_token %}


            <!-- Title -->
            <div>

                <label
                    for="title"
                    class="mb-2 block text-sm font-semibold text-slate-700"
                >
                    Notice Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ notice.title }}"
                    maxlength="200"
                    required
                    class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
                    placeholder="Enter notice title"
                >

            </div>


            <!-- Description -->
            <div>

                <label
                    for="description"
                    class="mb-2 block text-sm font-semibold text-slate-700"
                >
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="7"
                    class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
                    placeholder="Enter notice description"
                >{{ notice.description }}</textarea>

            </div>


            <!-- Buttons -->
            <div class="flex flex-col gap-3 pt-2 sm:flex-row sm:justify-end">

                <a
                    href="{% url 'admin-notice-list' %}"
                    class="inline-flex items-center justify-center rounded-xl border border-slate-300 bg-white px-5 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="inline-flex items-center justify-center rounded-xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-400"
                >

                    <i class="fa-solid fa-floppy-disk mr-2"></i>

                    Update Notice

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
